<?xml version="1.0" encoding="UTF-8"?>
<!--
  T2 — Стела маршрута «Тропа Сергия Радонежского»
  Production-ready SVG.

  Physical size: 600 × 1200 mm  (24M × 48M @ M = 25 mm)
  Color:         Pantone 731 C  (RGB 113,74,7  ·  CMYK 34,65,100,43  ·  RAL 8008 Olivebrown)
  Typeface:      Myriad Pro Bold Condensed (заголовок) + Condensed (вспомог.)
  Pictogram:     #38 Пешеходный туристский маршрут, согласно ГОСТ Р 57581-2017
                 и Методическому пособию Минкультуры РФ (2013), стр. 35.

  Импорт в Adobe Illustrator:
    File → Open (или Place).
    Артборд автоматически создаётся 600×1200 мм.
    Все координаты внутри — в миллиметрах (viewBox совпадает с width/height в mm).

  Перед сдачей в печать:
    1. Type → Create Outlines  (все надписи в кривые — независимость от установленного шрифта).
    2. Заменить #qr-placeholder реальным QR-кодом
       (ссылка: https://святогорово.рф/#sergiy).
    3. Проверить цвет: Pantone 731 C для офсета, либо CMYK 34/65/100/43 для цифровой.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="600mm" height="1200mm"
     viewBox="0 0 600 1200"
     fill-rule="evenodd"
     font-family="'Myriad Pro Condensed', 'PT Sans Narrow', 'Arial Narrow', sans-serif">

  <title>T2 — Стела маршрута «Тропа Сергия Радонежского»</title>
  <desc>Production-ready макет, 600×1200 мм. Цвет Pantone 731 C. Шрифт Myriad Pro Bold Condensed. Пиктограмма #38 согласно ГОСТ Р 57581-2017.</desc>

  <!-- ══════════════ Фон знака ══════════════ Pantone 731 C / #714A07 -->
  <rect id="sign-body"
        x="0" y="0" width="600" height="1200"
        rx="30" ry="30"
        fill="#714A07"/>

  <!-- ══════════════ Пиктограмма #38 ══════════════
       400×400 мм (16M × 16M), центрирована по горизонтали.
       Извлечена из Метод-пособия (стр. 35), векторизована potrace.
       Внутренние transform'ы — артефакт потрейса (потражные координаты 4680×4680,
       y-flipped); оборачивающий scale(0.4) приводит их к 400×400 мм в наших координатах. -->
  <g id="pictogram-38" transform="translate(100 80) scale(0.4)">
    <g transform="translate(0 172.024) scale(2.55234)">
      <g transform="translate(-31.202520,437.000095) scale(0.100000,-0.100000)" fill="#FFFFFF">
        <path d="M312 3083 c2 -709 4 -1081 5 -828 7 1215 7 2115 1 2115 -5 0 -7 -579 -6 -1287z"/>
        <path d="M4104 4348 c3 -13 6 -591 6 -1285 l0 -1263 60 0 60 0 0 1269 c0 698 -3 1276 -6 1285 -5 12 -21 16 -66 16 -58 0 -60 -1 -54 -22z"/>
        <path d="M2862 4107 c-6 -7 -11 -156 -13 -372 -3 -377 0 -405 40 -405 35 0 43 23 30 82 -7 30 -14 149 -16 275 l-4 223 166 2 166 3 -35 41 -36 42 41 46 41 46 -171 0 c-94 0 -171 4 -171 9 0 15 -28 21 -38 8z"/>
        <path d="M1720 3898 c-48 -33 -72 -70 -77 -122 l-6 -46 157 0 156 0 0 36 c0 114 -139 194 -230 132z"/>
        <path d="M1587 3668 c-28 -22 -32 -69 -7 -101 l21 -27 192 0 c106 0 197 4 203 8 38 25 40 103 4 122 -29 15 -392 13 -413 -2z"/>
        <path d="M2451 3608 c-5 -13 -26 -115 -46 -228 -21 -113 -41 -209 -45 -213 -4 -5 -46 -1 -94 9 -98 19 -82 -3 -125 172 -21 84 -47 134 -81 152 -18 10 -18 9 -5 -25 11 -26 15 -80 15 -219 0 -166 2 -186 18 -195 9 -5 66 -19 127 -31 60 -12 112 -23 114 -26 4 -4 -144 -809 -187 -1018 -15 -75 -15 -79 3 -92 52 -38 55 -28 154 506 121 645 108 589 137 596 29 7 54 40 54 70 0 13 -12 36 -26 53 l-25 30 42 224 c23 123 39 231 36 240 -10 26 -56 22 -66 -5z"/>
        <path d="M1499 3507 c-40 -27 -75 -76 -89 -126 -5 -20 -10 -157 -10 -309 0 -220 3 -278 15 -301 23 -46 66 -54 109 -20 22 17 26 28 26 74 0 29 -7 69 -15 88 -12 29 -15 87 -15 285 0 222 2 252 19 284 27 54 14 62 -40 25z"/>
        <path d="M1584 3468 c-11 -21 -14 -83 -14 -282 l0 -254 25 -30 c40 -47 68 -54 220 -50 l137 3 32 36 33 36 7 235 c7 230 2 307 -24 323 -5 3 -98 7 -206 8 l-196 2 -14 -27z"/>
        <path d="M2962 3298 c-21 -21 -13 -48 20 -68 65 -39 118 -34 118 11 0 13 -17 27 -52 44 -59 28 -69 30 -86 13z"/>
        <path d="M3164 3227 c-14 -36 0 -52 59 -66 62 -14 87 -6 87 29 0 27 -21 39 -83 46 -46 6 -58 4 -63 -9z"/>
        <path d="M3376 3183 c-11 -35 4 -52 59 -64 64 -14 85 -8 85 25 0 31 -24 45 -89 53 -43 5 -50 3 -55 -14z"/>
        <path d="M3563 3088 c-13 -16 -24 -103 -17 -123 8 -19 48 -19 64 0 18 22 25 102 10 120 -15 18 -44 20 -57 3z"/>
        <path d="M3455 2863 c-42 -55 -43 -86 -4 -91 51 -6 118 115 73 132 -27 10 -32 7 -69 -41z"/>
        <path d="M1600 2373 l0 -454 26 -24 c45 -42 110 -30 139 25 13 24 15 92 15 430 0 377 1 401 18 398 16 -3 17 -33 22 -417 l5 -413 28 -24 c39 -33 81 -31 118 5 l29 29 0 451 c0 248 -1 451 -2 451 -2 0 -21 -7 -43 -15 -53 -19 -265 -19 -317 -1 l-38 14 0 -455z"/>
        <path d="M3311 2696 c-33 -34 -42 -49 -36 -65 8 -27 39 -27 73 0 42 32 62 69 51 91 -16 29 -42 21 -88 -26z"/>
        <path d="M3142 2551 c-38 -35 -42 -43 -32 -60 17 -32 52 -25 99 18 37 34 41 42 31 60 -16 32 -50 25 -98 -18z"/>
        <path d="M2973 2435 c-46 -28 -57 -61 -28 -85 12 -10 23 -7 58 13 58 34 74 54 60 75 -16 26 -44 25 -90 -3z"/>
        <path d="M2778 2320 c-53 -33 -53 -33 -38 -61 14 -25 46 -24 95 4 33 18 40 28 40 52 0 42 -36 44 -97 5z"/>
        <path d="M2592 2234 c-49 -34 -12 -83 47 -63 35 12 54 39 45 63 -8 21 -63 21 -92 0z"/>
      </g>
    </g>
  </g>

  <!-- ══════════════ Разделительная линия ══════════════ y = 25.6M -->
  <line id="divider" x1="80" y1="640" x2="520" y2="640"
        stroke="#FFFFFF" stroke-width="3"/>

  <!-- ══════════════ Заголовок (русский, Bold Condensed) ══════════════ -->
  <g id="title-ru">
    <text x="300" y="725"
          font-weight="700" font-size="60" font-stretch="condensed"
          text-anchor="middle" fill="#FFFFFF">ТРОПА СЕРГИЯ</text>
    <text x="300" y="795"
          font-weight="700" font-size="60" font-stretch="condensed"
          text-anchor="middle" fill="#FFFFFF">РАДОНЕЖСКОГО</text>
  </g>

  <!-- ══════════════ Подзаголовок (английский, Regular Condensed) ══════════════ -->
  <text id="title-en" x="300" y="870"
        font-weight="400" font-size="44" font-stretch="condensed"
        text-anchor="middle" fill="#FFFFFF" opacity="0.85">SAINT SERGIUS TRAIL</text>

  <!-- ══════════════ Маркер фазы (нижний левый угол) ══════════════ -->
  <g id="phase-marker">
    <text x="50" y="1080"
          font-weight="700" font-size="20" font-stretch="condensed"
          fill="#FFFFFF" opacity="0.6">СВЯТОГОРОВО</text>
    <text x="50" y="1106"
          font-weight="400" font-size="16" font-stretch="condensed"
          fill="#FFFFFF" opacity="0.6">отрезок · фаза 1</text>
  </g>

  <!-- ══════════════ QR-код ══════════════
       120×120 мм. ЗАГЛУШКА — заменить реальным QR на https://святогорово.рф/#sergiy
       перед сдачей в печать. Размер 4.8M × 4.8M обеспечивает считывание с расстояния ~2 м. -->
  <g id="qr-placeholder">
    <rect x="450" y="990" width="120" height="120" rx="6" fill="#FFFFFF"/>
    <g fill="#714A07">
      <rect x="465" y="1005" width="30" height="30"/>
      <rect x="525" y="1005" width="30" height="30"/>
      <rect x="465" y="1065" width="30" height="30"/>
      <rect x="515" y="1055" width="10" height="10"/>
      <rect x="535" y="1075" width="10" height="10"/>
      <rect x="505" y="1085" width="10" height="10"/>
      <rect x="540" y="1095" width="10" height="10"/>
    </g>
  </g>

  <!-- ══════════════ Модульная сетка (скрыта, для построения) ══════════════
       Видна только при разблокировке слоя в Illustrator. M = 25 мм.
       Сетка демонстрирует соответствие ГОСТ Р 52290 (модульная сетка дорожных знаков). -->
  <g id="construction-grid" display="none" stroke="#FFFFFF" stroke-width="0.3" opacity="0.4">
    <!-- Vertical lines every 25mm -->
    <g id="grid-vertical">
      <line x1="25"  y1="0" x2="25"  y2="1200"/>
      <line x1="50"  y1="0" x2="50"  y2="1200"/>
      <line x1="75"  y1="0" x2="75"  y2="1200"/>
      <line x1="100" y1="0" x2="100" y2="1200"/>
      <line x1="125" y1="0" x2="125" y2="1200"/>
      <line x1="150" y1="0" x2="150" y2="1200"/>
      <line x1="175" y1="0" x2="175" y2="1200"/>
      <line x1="200" y1="0" x2="200" y2="1200"/>
      <line x1="225" y1="0" x2="225" y2="1200"/>
      <line x1="250" y1="0" x2="250" y2="1200"/>
      <line x1="275" y1="0" x2="275" y2="1200"/>
      <line x1="300" y1="0" x2="300" y2="1200" stroke-width="0.6"/>  <!-- center -->
      <line x1="325" y1="0" x2="325" y2="1200"/>
      <line x1="350" y1="0" x2="350" y2="1200"/>
      <line x1="375" y1="0" x2="375" y2="1200"/>
      <line x1="400" y1="0" x2="400" y2="1200"/>
      <line x1="425" y1="0" x2="425" y2="1200"/>
      <line x1="450" y1="0" x2="450" y2="1200"/>
      <line x1="475" y1="0" x2="475" y2="1200"/>
      <line x1="500" y1="0" x2="500" y2="1200"/>
      <line x1="525" y1="0" x2="525" y2="1200"/>
      <line x1="550" y1="0" x2="550" y2="1200"/>
      <line x1="575" y1="0" x2="575" y2="1200"/>
    </g>
    <!-- Horizontal lines every 25mm — only key ones to avoid clutter -->
    <g id="grid-horizontal">
      <line x1="0" y1="25"   x2="600" y2="25"/>
      <line x1="0" y1="100"  x2="600" y2="100"/>
      <line x1="0" y1="200"  x2="600" y2="200"/>
      <line x1="0" y1="300"  x2="600" y2="300"/>
      <line x1="0" y1="400"  x2="600" y2="400"/>
      <line x1="0" y1="500"  x2="600" y2="500"/>
      <line x1="0" y1="600"  x2="600" y2="600" stroke-width="0.6"/>  <!-- center -->
      <line x1="0" y1="700"  x2="600" y2="700"/>
      <line x1="0" y1="800"  x2="600" y2="800"/>
      <line x1="0" y1="900"  x2="600" y2="900"/>
      <line x1="0" y1="1000" x2="600" y2="1000"/>
      <line x1="0" y1="1100" x2="600" y2="1100"/>
      <line x1="0" y1="1175" x2="600" y2="1175"/>
    </g>
  </g>

</svg>
