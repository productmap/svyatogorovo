<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Пиктограмма #9: Место отдыха">
  <title>Место отдыха / Rest area</title>
  <desc>По Методичке стр. 24: стилизованное изображение фигуры человека, комфортно сидящего на скамье в расслабленной позе.</desc>

  <!-- Brown rounded background -->
  <rect width="1000" height="1000" rx="80" fill="#714A07"/>

  <g fill="#fff">
    <!-- Head -->
    <circle cx="380" cy="290" r="68"/>

    <!-- Torso (leaning back slightly) -->
    <path d="M 330 370 L 460 370 L 480 540 L 320 540 Z"/>

    <!-- Arm resting -->
    <path d="M 460 380 Q 540 410 580 510 L 540 530 Q 510 460 450 440 Z"/>

    <!-- Upper leg (horizontal on bench) -->
    <rect x="450" y="530" width="240" height="65" rx="20"/>

    <!-- Lower leg (hanging down) -->
    <rect x="630" y="595" width="65" height="180" rx="20"/>
    <!-- Foot -->
    <ellipse cx="662" cy="790" rx="55" ry="22"/>

    <!-- Bench seat (full width) -->
    <rect x="180" y="775" width="640" height="35" rx="6"/>
    <!-- Bench legs -->
    <rect x="220" y="810" width="30" height="100" rx="6"/>
    <rect x="750" y="810" width="30" height="100" rx="6"/>
    <!-- Bench backrest support behind sitting person -->
    <rect x="280" y="540" width="20" height="240" rx="5"/>
    <!-- Bench backrest horizontal -->
    <rect x="180" y="540" width="160" height="20" rx="5"/>
  </g>
</svg>
