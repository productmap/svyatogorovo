<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Пиктограмма #38: Пешеходный туристский маршрут">
  <title>Пешеходный туристский маршрут / Tourist trail</title>
  <desc>По Методичке Минкультуры РФ (2013), стр. 35: фигура человека с рюкзаком и палкой, пунктир - маршрут, финишный флажок.</desc>

  <!-- Brown rounded background -->
  <rect width="1000" height="1000" rx="80" fill="#714A07"/>

  <g fill="#fff">
    <!-- Walking staff -->
    <rect x="370" y="100" width="22" height="720" rx="11"/>

    <!-- Head -->
    <circle cx="285" cy="225" r="72"/>

    <!-- Torso (trapezoidal, leaning slightly forward) -->
    <path d="M 230 315 L 350 305 L 390 520 L 200 520 Z"/>

    <!-- Backpack (rounded rect on back-left) -->
    <rect x="135" y="345" width="100" height="180" rx="18"/>
    <!-- Backpack top strap -->
    <rect x="190" y="320" width="45" height="40" rx="10"/>

    <!-- Arm holding staff (from shoulder forward to staff) -->
    <path d="M 335 330 Q 365 320 385 330 L 395 380 Q 355 380 330 380 Z"/>

    <!-- Front leg (forward, bent) -->
    <path d="M 255 520 L 220 760 L 285 770 L 320 535 Z"/>
    <!-- Front foot -->
    <ellipse cx="245" cy="785" rx="55" ry="22"/>

    <!-- Back leg (trailing) -->
    <path d="M 320 520 L 380 720 L 440 720 L 360 525 Z"/>
    <!-- Back foot -->
    <ellipse cx="415" cy="740" rx="55" ry="22"/>

    <!-- Dotted route line (curving up and right from feet to flag) -->
    <circle cx="490" cy="700" r="18"/>
    <circle cx="560" cy="640" r="18"/>
    <circle cx="625" cy="570" r="18"/>
    <circle cx="685" cy="495" r="18"/>
    <circle cx="740" cy="420" r="18"/>
    <circle cx="785" cy="345" r="18"/>

    <!-- Flag pole -->
    <rect x="815" y="180" width="18" height="200" rx="6"/>
    <!-- Flag (triangular pennant) -->
    <path d="M 833 180 L 940 215 L 833 250 Z"/>
  </g>
</svg>
