<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Пиктограмма #12: Загородная гостиница">
  <title>Загородная гостиница / Country inn</title>
  <desc>По Методичке стр. 25: человек, комфортно спящий в кровати; конек крыши (охлупень/шелом), символизирующий загородную архитектуру.</desc>

  <!-- Brown rounded background -->
  <rect width="1000" height="1000" rx="80" fill="#714A07"/>

  <g fill="#fff">
    <!-- Roof peak (with traditional Russian охлупень finial) -->
    <path d="M 160 470 L 500 230 L 840 470 Z"/>
    <!-- Охлупень finial (decorative top crest) -->
    <rect x="488" y="180" width="24" height="80" rx="6"/>
    <circle cx="500" cy="180" r="22"/>

    <!-- House body -->
    <rect x="200" y="470" width="600" height="380"/>

    <!-- Pillow -->
    <ellipse cx="320" cy="640" rx="60" ry="30"/>

    <!-- Sleeping figure head (on pillow) -->
    <circle cx="320" cy="610" r="44"/>

    <!-- Blanket (covering body) -->
    <path d="M 280 670 L 660 670 L 680 740 L 280 740 Z"/>

    <!-- Bed (mattress base) -->
    <rect x="240" y="740" width="460" height="40" rx="8"/>

    <!-- Bed legs -->
    <rect x="250" y="780" width="22" height="50"/>
    <rect x="668" y="780" width="22" height="50"/>
  </g>
</svg>
