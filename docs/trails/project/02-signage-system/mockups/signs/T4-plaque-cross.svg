<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="T4: Интерпретационная табличка у Поклонного креста (пример)">
  <title>T4 — Интерпретационная табличка у Поклонного креста</title>
  <desc>Размещается в 3-5 м от объекта, под наклоном 15-30°. Размер реального знака — 800×600 мм. Пример для Поклонного креста; для остальных объектов меняются пиктограмма и текстовый блок.</desc>

  <defs>
    <g id="pict-cross">
      <g transform="translate(0 6.97772) scale(3.83675)">
    <g transform="translate(-161.362693,437.000000) scale(0.100000,-0.100000)" fill="#fff">
      <path d="M4090 4344 c6 -16 10 -491 10 -1285 l0 -1259 60 0 60 0 0 1263 c0
694 -3 1272 -6 1285 -6 20 -12 22 -70 22 l-64 0 10 -26z"/>
<path d="M2148 4134 c-37 -19 -58 -63 -58 -119 l0 -45 -65 0 c-75 0 -105 -20
-105 -70 0 -50 30 -70 105 -70 l65 0 0 -40 0 -40 -204 0 c-113 0 -216 -4 -229
-9 -13 -5 -29 -23 -36 -39 -10 -25 -10 -35 3 -60 8 -16 26 -32 38 -36 13 -3
114 -6 226 -6 l202 0 0 -236 c0 -220 -1 -236 -17 -231 -10 3 -53 18 -95 33
l-77 29 -28 -21 c-32 -24 -41 -65 -20 -97 9 -14 55 -38 125 -65 l111 -43 5
-252 c3 -139 8 -280 11 -313 l7 -62 -49 -16 c-112 -37 -206 -122 -260 -234
-31 -64 -36 -85 -37 -151 l-1 -76 438 -3 437 -2 0 52 c-1 181 -128 356 -302
414 l-50 16 7 62 c3 33 9 154 13 268 l7 207 73 -30 c90 -36 135 -38 156 -7 23
33 20 73 -8 95 -13 11 -69 37 -125 59 l-101 39 0 282 0 282 220 3 c192 3 221
5 237 20 26 26 22 86 -6 109 -21 17 -43 19 -237 19 l-214 0 0 40 0 40 63 0
c79 0 107 17 107 66 0 55 -27 74 -105 74 l-65 0 0 45 c0 104 -81 163 -162 119z"/>
    </g>
  </g>
    </g>
  </defs>

  <!-- Plaque background -->
  <rect width="800" height="600" rx="20" fill="#714A07"/>

  <!-- Header: pictogram + name -->
  <g transform="translate(30 25) scale(0.13)">
    <use href="#pict-cross"/>
  </g>
  <text x="180" y="80" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="700" font-size="48" font-stretch="condensed">ПОКЛОННЫЙ КРЕСТ</text>
  <text x="180" y="120" fill="#fff" opacity="0.85"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="28" font-stretch="condensed">HOLY CROSS</text>

  <!-- Divider -->
  <line x1="30" y1="170" x2="770" y2="170" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Russian text block -->
  <text x="30" y="215" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="24" font-stretch="condensed">
    <tspan x="30" dy="0">Остановись, путник. Этот крест поставлен на месте,</tspan>
    <tspan x="30" dy="32">где паломники, идущие в Лавру преподобного Сергия,</tspan>
    <tspan x="30" dy="32">сворачивали с большой дороги. Сними шапку,</tspan>
    <tspan x="30" dy="32">перекрестись — и дальше с миром.</tspan>
  </text>

  <!-- English text block -->
  <text x="30" y="380" fill="#fff" opacity="0.8"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-style="italic" font-size="20" font-stretch="condensed">
    <tspan x="30" dy="0">Stop here, traveller. This cross stands where pilgrims walking</tspan>
    <tspan x="30" dy="26">to the Lavra of St Sergius would turn from the main road.</tspan>
    <tspan x="30" dy="26">Uncover your head, cross yourself, and go on in peace.</tspan>
  </text>

  <!-- Bottom row: attribution + QR -->
  <line x1="30" y1="500" x2="770" y2="500" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="30" y="540" fill="#fff" opacity="0.7"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="18" font-stretch="condensed">Установлен 2008 г. · По благословению</text>
  <text x="30" y="565" fill="#fff" opacity="0.7"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="18" font-stretch="condensed">настоятеля Сретенского храма г. Дмитрова</text>

  <!-- QR -->
  <rect x="680" y="510" width="80" height="80" fill="#fff" rx="4"/>
  <g fill="#714A07">
    <rect x="690" y="520" width="18" height="18"/>
    <rect x="732" y="520" width="18" height="18"/>
    <rect x="690" y="562" width="18" height="18"/>
    <rect x="715" y="545" width="8" height="8"/>
    <rect x="730" y="555" width="8" height="8"/>
    <rect x="720" y="572" width="8" height="8"/>
  </g>

  <!-- Draft label -->
  <text x="30" y="592" fill="#fff" opacity="0.3" font-size="9" font-family="sans-serif">T4 · INTERPRETIVE PLAQUE · DRAFT v0.1 · /#krest</text>
</svg>
