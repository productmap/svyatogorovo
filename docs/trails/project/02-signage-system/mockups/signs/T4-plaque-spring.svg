<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="T4: Интерпретационная табличка у Купели">
  <title>T4 — Интерпретационная табличка у Купели</title>
  <desc>Размещается в 3-5 м от купели. Размер реального знака — 800×600 мм. Пиктограмма #48 вариант 3 по Методичке стр. 39 (локальный религиозный объект, место паломничества).</desc>

  <defs>
    <g id="pict-cross" fill="#fff">
      <path d="M 270 820 L 730 820 L 685 720 L 315 720 Z"/>
      <rect x="475" y="180" width="50" height="540"/>
      <rect x="425" y="230" width="150" height="30"/>
      <rect x="335" y="330" width="330" height="50"/>
      <path d="M 360 510 L 640 480 L 640 530 L 360 560 Z"/>
    </g>
  </defs>

  <!-- Plaque background -->
  <rect width="800" height="600" rx="20" fill="#714A07"/>

  <!-- Header: pictogram + name -->
  <g transform="translate(30 25) scale(0.13)">
    <use href="#pict-cross"/>
  </g>
  <text x="180" y="80" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="700" font-size="48" font-stretch="condensed">КУПЕЛЬ</text>
  <text x="180" y="120" fill="#fff" opacity="0.85"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="28" font-stretch="condensed">HOLY SPRING</text>

  <!-- Divider -->
  <line x1="30" y1="170" x2="770" y2="170" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Russian text block -->
  <text x="30" y="215" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="24" font-stretch="condensed">
    <tspan x="30" dy="0">Древняя традиция велит путнику омыться перед</tspan>
    <tspan x="30" dy="32">поклонением святыне. Купель — место, где паломник</tspan>
    <tspan x="30" dy="32">готовится телесно и духовно к продолжению</tspan>
    <tspan x="30" dy="32">пути к Лавре преподобного Сергия.</tspan>
  </text>

  <!-- English text block -->
  <text x="30" y="380" fill="#fff" opacity="0.8"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-style="italic" font-size="20" font-stretch="condensed">
    <tspan x="30" dy="0">Ancient tradition asks the traveller to wash before</tspan>
    <tspan x="30" dy="26">approaching the sanctuary. This spring is where</tspan>
    <tspan x="30" dy="26">pilgrims prepare themselves, body and soul, for</tspan>
    <tspan x="30" dy="26">the continuation of the road to the Lavra.</tspan>
  </text>

  <!-- Bottom row: attribution + QR -->
  <line x1="30" y1="500" x2="770" y2="500" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="30" y="540" fill="#fff" opacity="0.7"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="18" font-stretch="condensed">Купание возможно в тёплое время года ·</text>
  <text x="30" y="565" fill="#fff" opacity="0.7"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="18" font-stretch="condensed">соблюдайте тишину и порядок</text>

  <!-- QR -->
  <rect x="680" y="510" width="80" height="80" fill="#fff" rx="4"/>
  <g fill="#714A07">
    <rect x="690" y="520" width="18" height="18"/>
    <rect x="732" y="520" width="18" height="18"/>
    <rect x="690" y="562" width="18" height="18"/>
    <rect x="715" y="545" width="8" height="8"/>
    <rect x="730" y="555" width="8" height="8"/>
    <rect x="720" y="572" width="8" height="8"/>
  </g>

  <!-- Draft label -->
  <text x="30" y="592" fill="#fff" opacity="0.3" font-size="9" font-family="sans-serif">T4 · SPRING PLAQUE · DRAFT v0.1 · /#kupel</text>
</svg>
