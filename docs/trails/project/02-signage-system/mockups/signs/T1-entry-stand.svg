  <text x="60" y="1395" fill="#fff" opacity="0.85"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="26" font-stretch="condensed">+7 (926) 555-19-20 · igrastoria@mail.ru · святогорово.рф</text>
  <text x="60" y="1430" fill="#fff" opacity="0.6"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="20" font-stretch="condensed" font-style="italic">Воскресная школа «Преображение» Сретенского храма г. Дмитрова</text>

