  <!-- Stand background -->
  <rect width="2000" height="1500" rx="40" fill="#714A07"/>

  <!-- ─────────────── Top: Title bar ─────────────── -->
  <text x="60" y="120" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="700" font-size="84" font-stretch="condensed">ТРОПА ПРЕПОДОБНОГО СЕРГИЯ РАДОНЕЖСКОГО</text>
  <text x="60" y="180" fill="#fff" opacity="0.85"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="48" font-stretch="condensed">SAINT SERGIUS OF RADONEZH PILGRIM TRAIL</text>

  <!-- TIC pictogram in top-right corner -->
  <g transform="translate(1820 30) scale(0.15)">
    <use href="#pict-tic"/>
  </g>

  <!-- Divider under title -->
  <line x1="60" y1="220" x2="1940" y2="220" stroke="#fff" stroke-width="3" opacity="0.6"/>

  <!-- ─────────────── Left half: Schematic map ─────────────── -->
  <g transform="translate(60 260)">
    <!-- Map label -->
    <text x="0" y="40" fill="#fff" opacity="0.7"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="400" font-size="28" font-stretch="condensed">СХЕМА МАРШРУТА · ROUTE MAP</text>

    <!-- Map background (light area) -->
    <rect x="0" y="60" width="900" height="850" fill="#fff" opacity="0.08" rx="12"/>

    <!-- North arrow -->
    <g transform="translate(820 110)">
      <circle r="32" fill="#fff" opacity="0.12"/>
      <path d="M 0 -22 L 12 12 L 0 5 L -12 12 Z" fill="#fff"/>
      <text y="-30" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">С</text>
    </g>

    <!-- Trail dashed line (simulating actual route through points) -->
    <path d="M 80 760 Q 200 600 300 550 T 500 380 Q 600 320 720 240"
          fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="14 10"/>

    <!-- Trail extension arrow toward Lavra (phase 2) -->
    <path d="M 720 240 L 800 180" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="14 10" opacity="0.4"/>
    <text x="730" y="170" fill="#fff" opacity="0.55"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-size="20" font-style="italic">→ к Лавре · to Lavra</text>

    <!-- Trail start arrow back from Dmitrov (phase 2) -->
    <path d="M 80 760 L 10 800" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="14 10" opacity="0.4"/>
    <text x="20" y="855" fill="#fff" opacity="0.55"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-size="20" font-style="italic">← из Дмитрова · from Dmitrov</text>

    <!-- Point 1: Start (entry) — circular marker -->
    <circle cx="80" cy="760" r="14" fill="#fff"/>
    <circle cx="80" cy="760" r="6" fill="#714A07"/>
    <text x="105" y="770" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="22" font-stretch="condensed">ВЫ ЗДЕСЬ</text>

    <!-- Point 2: Guest house -->
    <circle cx="200" cy="650" r="12" fill="#fff"/>
    <text x="220" y="660" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="20" font-stretch="condensed">Гостевой дом</text>

    <!-- Point 3: Chapel -->
    <circle cx="300" cy="550" r="12" fill="#fff"/>
    <text x="320" y="560" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="20" font-stretch="condensed">Часовня свт. Николая</text>

    <!-- Point 4: Cross -->
    <circle cx="500" cy="380" r="14" fill="#fff"/>
    <circle cx="500" cy="380" r="6" fill="#714A07"/>
    <text x="520" y="390" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="22" font-stretch="condensed">Поклонный крест</text>

    <!-- Point 5: View point -->
    <circle cx="720" cy="240" r="12" fill="#fff"/>
    <text x="555" y="225" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="20" font-stretch="condensed">Смотровая площадка</text>
  </g>

  <!-- ─────────────── Right half: Objects list + contacts ─────────────── -->
  <g transform="translate(1020 260)">
    <text x="0" y="40" fill="#fff" opacity="0.7"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="400" font-size="28" font-stretch="condensed">ОБЪЕКТЫ НА МАРШРУТЕ · POINTS ON THE TRAIL</text>

    <!-- Row 1: Cross -->
    <g transform="translate(0 80)">
