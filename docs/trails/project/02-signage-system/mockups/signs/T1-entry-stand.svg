    </g>

    <!-- Row 3: Viewpoint -->
    <g transform="translate(0 420)">
      <g transform="translate(0 0) scale(0.18)">
        <use href="#pict-view"/>
      </g>
      <text x="220" y="60" fill="#fff"
            font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
            font-weight="700" font-size="40" font-stretch="condensed">СМОТРОВАЯ ПЛОЩАДКА</text>
      <text x="220" y="100" fill="#fff" opacity="0.75"
            font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
            font-weight="400" font-size="26" font-stretch="condensed">Viewpoint · 800 м</text>
      <text x="220" y="135" fill="#fff" opacity="0.65"
            font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
            font-weight="400" font-size="20" font-stretch="condensed" font-style="italic">панорама долины</text>
    </g>

    <!-- Row 4: Guest house -->
    <g transform="translate(0 590)">
      <g transform="translate(0 0) scale(0.18)">
        <use href="#pict-inn"/>
      </g>
      <text x="220" y="60" fill="#fff"
            font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
            font-weight="700" font-size="40" font-stretch="condensed">ГОСТЕВОЙ ДОМ</text>
      <text x="220" y="100" fill="#fff" opacity="0.75"
            font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
            font-weight="400" font-size="26" font-stretch="condensed">Guest House · 250 м</text>
      <text x="220" y="135" fill="#fff" opacity="0.65"
            font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
            font-weight="400" font-size="20" font-stretch="condensed" font-style="italic">размещение для паломников</text>
    </g>
  </g>

  <!-- ─────────────── Bottom strip: contacts + QR ─────────────── -->
  <line x1="60" y1="1290" x2="1940" y2="1290" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <text x="60" y="1350" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
