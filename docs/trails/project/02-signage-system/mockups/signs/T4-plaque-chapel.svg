  <!-- Plaque background -->
  <rect width="800" height="600" rx="20" fill="#714A07"/>

  <!-- Header: pictogram + name -->
  <g transform="translate(30 25) scale(0.13)">
    <use href="#pict-church"/>
  </g>
  <text x="180" y="80" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="700" font-size="48" font-stretch="condensed">ЧАСОВНЯ СВТ. НИКОЛАЯ</text>
  <text x="180" y="120" fill="#fff" opacity="0.85"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="28" font-stretch="condensed">CHAPEL OF ST NICHOLAS</text>

  <!-- Divider -->
  <line x1="30" y1="170" x2="770" y2="170" stroke="#fff" stroke-width="2" opacity="0.6"/>

  <!-- Russian text block -->
  <text x="30" y="215" fill="#fff"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="24" font-stretch="condensed">
    <tspan x="30" dy="0">Святитель Николай — заступник тех, кто в дороге.</tspan>
    <tspan x="30" dy="32">Здесь, посреди пути, можно остановиться и</tspan>
    <tspan x="30" dy="32">помолиться: о тех, кто идёт сегодня, и о тех,</tspan>
    <tspan x="30" dy="32">кто когда-то прошёл здесь до нас.</tspan>
  </text>

  <!-- English text block -->
  <text x="30" y="380" fill="#fff" opacity="0.8"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-style="italic" font-size="20" font-stretch="condensed">
    <tspan x="30" dy="0">Saint Nicholas the Wonderworker is the protector of</tspan>
    <tspan x="30" dy="26">travellers. Here, midway through the path, you may</tspan>
    <tspan x="30" dy="26">pause to pray — for those walking today, and for</tspan>
    <tspan x="30" dy="26">those who once walked this road before us.</tspan>
  </text>

  <!-- Bottom row: attribution + QR -->
  <line x1="30" y1="500" x2="770" y2="500" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="30" y="540" fill="#fff" opacity="0.7"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="18" font-stretch="condensed">Построена в 20___ г. · Освящена</text>
  <text x="30" y="565" fill="#fff" opacity="0.7"
        font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
        font-weight="400" font-size="18" font-stretch="condensed">настоятелем Сретенского храма г. Дмитрова</text>

