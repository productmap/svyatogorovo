<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" role="img" aria-label="T3: Указатели направления (типовой узел из 3 панелей)">
  <title>T3 — Указатели направления, типовой узел из трёх панелей на одной опоре</title>
  <desc>На развилке тропы. Каждая панель — отдельный знак с одним направлением. Размер реальной панели — 800×220 мм. Опора слева, панели крепятся справа.</desc>

  <defs>
    <!-- Pictogram #48c (Cross on pedestal) — only white shapes -->
    <g id="pict-cross" fill="#fff">
      <path d="M 270 820 L 730 820 L 685 720 L 315 720 Z"/>
      <rect x="475" y="180" width="50" height="540"/>
      <rect x="425" y="230" width="150" height="30"/>
      <rect x="335" y="330" width="330" height="50"/>
      <path d="M 360 510 L 640 480 L 640 530 L 360 560 Z"/>
    </g>

    <!-- Pictogram #48b (Church) — only white shapes -->
    <g id="pict-church" fill="#fff">
      <rect x="488" y="60" width="24" height="200"/>
      <rect x="445" y="100" width="110" height="22"/>
      <rect x="455" y="160" width="90" height="20"/>
      <path d="M 500 260 Q 420 290 410 380 Q 410 460 460 480 L 540 480 Q 590 460 590 380 Q 580 290 500 260 Z"/>
      <rect x="450" y="480" width="100" height="60"/>
      <path d="M 320 540 L 500 460 L 680 540 Z"/>
      <rect x="320" y="540" width="360" height="320"/>
      <path d="M 460 860 L 460 730 Q 460 700 500 700 Q 540 700 540 730 L 540 860 Z"/>
      <rect x="360" y="640" width="40" height="80" rx="20"/>
      <rect x="600" y="640" width="40" height="80" rx="20"/>
    </g>

    <!-- Pictogram #12 (Country inn) — only white shapes -->
    <g id="pict-inn" fill="#fff">
      <path d="M 160 470 L 500 230 L 840 470 Z"/>
      <rect x="488" y="180" width="24" height="80" rx="6"/>
      <circle cx="500" cy="180" r="22"/>
      <rect x="200" y="470" width="600" height="380"/>
      <ellipse cx="320" cy="640" rx="60" ry="30"/>
      <circle cx="320" cy="610" r="44"/>
      <path d="M 280 670 L 660 670 L 680 740 L 280 740 Z"/>
      <rect x="240" y="740" width="460" height="40" rx="8"/>
      <rect x="250" y="780" width="22" height="50"/>
      <rect x="668" y="780" width="22" height="50"/>
    </g>

    <!-- Arrow (white, points left in default orientation) -->
    <g id="arrow-left" fill="#fff">
      <rect x="35" y="-15" width="55" height="30" rx="2"/>
      <path d="M 35 -40 L 35 40 L -10 0 Z"/>
    </g>

    <!-- Reusable: a single directional panel.
         Slot via translate. Customize via children. -->
  </defs>

  <!-- Mast (support column, runs full height) -->
  <rect x="40" y="20" width="36" height="1260" fill="#4a4a4a" rx="3"/>
  <rect x="40" y="20" width="36" height="1260" fill="#7a7a7a" rx="3" opacity="0.4"/>

  <!-- Mast base (bolted plate at ground level) -->
  <rect x="0" y="1240" width="120" height="40" fill="#4a4a4a" rx="3"/>

  <!-- ───────────────────────── Panel 1: → Поклонный крест ───────────────────────── -->
  <g transform="translate(96 80)">
    <!-- Panel background -->
    <rect width="780" height="220" rx="20" fill="#714A07"/>
    <!-- Arrow (left) -->
    <g transform="translate(70 110)">
      <use href="#arrow-left"/>
    </g>
    <!-- Pictogram (small, 130px) -->
    <g transform="translate(155 30) scale(0.16)">
      <use href="#pict-cross"/>
    </g>
    <!-- Object name Russian -->
    <text x="335" y="95" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="48" font-stretch="condensed">ПОКЛОННЫЙ КРЕСТ</text>
    <!-- Object name English -->
    <text x="335" y="135" fill="#fff" opacity="0.85"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="400" font-size="30" font-stretch="condensed">HOLY CROSS</text>
    <!-- Distance -->
    <text x="335" y="190" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="42" font-stretch="condensed">1,2 км</text>
    <!-- QR mini -->
    <rect x="700" y="155" width="60" height="60" fill="#fff" rx="3"/>
    <g fill="#714A07">
      <rect x="708" y="163" width="14" height="14"/>
      <rect x="738" y="163" width="14" height="14"/>
      <rect x="708" y="193" width="14" height="14"/>
      <rect x="730" y="185" width="6" height="6"/>
      <rect x="744" y="195" width="6" height="6"/>
    </g>
  </g>

  <!-- ───────────────────────── Panel 2: → Часовенка Николая Чудотворца ───────────────────────── -->
  <g transform="translate(96 360)">
    <rect width="780" height="220" rx="20" fill="#714A07"/>
    <g transform="translate(70 110)">
      <use href="#arrow-left"/>
    </g>
    <g transform="translate(155 30) scale(0.16)">
      <use href="#pict-church"/>
    </g>
    <text x="335" y="95" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="44" font-stretch="condensed">ЧАСОВНЯ СВТ. НИКОЛАЯ</text>
    <text x="335" y="135" fill="#fff" opacity="0.85"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="400" font-size="30" font-stretch="condensed">CHAPEL OF ST NICHOLAS</text>
    <text x="335" y="190" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="42" font-stretch="condensed">400 м</text>
    <rect x="700" y="155" width="60" height="60" fill="#fff" rx="3"/>
    <g fill="#714A07">
      <rect x="708" y="163" width="14" height="14"/>
      <rect x="738" y="163" width="14" height="14"/>
      <rect x="708" y="193" width="14" height="14"/>
      <rect x="730" y="185" width="6" height="6"/>
      <rect x="744" y="195" width="6" height="6"/>
    </g>
  </g>

  <!-- ───────────────────────── Panel 3: ← Гостевой дом (opposite direction) ───────────────────────── -->
  <g transform="translate(96 640)">
    <rect width="780" height="220" rx="20" fill="#714A07"/>
    <!-- Arrow rotated 180° (points right) -->
    <g transform="translate(115 110) rotate(180)">
      <use href="#arrow-left"/>
    </g>
    <g transform="translate(155 30) scale(0.16)">
      <use href="#pict-inn"/>
    </g>
    <text x="335" y="95" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="48" font-stretch="condensed">ГОСТЕВОЙ ДОМ</text>
    <text x="335" y="135" fill="#fff" opacity="0.85"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="400" font-size="30" font-stretch="condensed">GUEST HOUSE</text>
    <text x="335" y="190" fill="#fff"
          font-family="'Myriad Pro Condensed','PT Sans Narrow','Arial Narrow',sans-serif"
          font-weight="700" font-size="42" font-stretch="condensed">250 м</text>
    <rect x="700" y="155" width="60" height="60" fill="#fff" rx="3"/>
    <g fill="#714A07">
      <rect x="708" y="163" width="14" height="14"/>
      <rect x="738" y="163" width="14" height="14"/>
      <rect x="708" y="193" width="14" height="14"/>
      <rect x="730" y="185" width="6" height="6"/>
      <rect x="744" y="195" width="6" height="6"/>
    </g>
  </g>

  <!-- Ground line (just visual context) -->
  <line x1="0" y1="1240" x2="900" y2="1240" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="700" y="1265" fill="#999" font-family="sans-serif" font-size="14">уровень земли</text>

  <!-- Draft label -->
  <text x="40" y="1295" fill="#999" font-size="11" font-family="sans-serif">T3 · INDICATOR (typical 3-panel mast) · DRAFT v0.1</text>
</svg>
